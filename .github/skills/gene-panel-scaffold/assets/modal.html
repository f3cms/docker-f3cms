<div class="box">
  <form class="gee" data-gene="init:loadRow,submit:setRow" data-tmpl="{{ENTITY}}Form" id="{{ENTITY}}Form">
    <div class="modal-header">
      <h2 class="module-title">編輯 {{ENTITY_TITLE}}</h2>
    </div>
    <input type="hidden" name="id">

    <div class="field">
      <label class="label">標題</label>
      <p class="control">
        <input class="input" name="lang[tw][title]" type="text" placeholder="請輸入標題">
      </p>
    </div>
    <div class="field">
      <label class="label">摘要</label>
      <p class="control">
        <textarea name="lang[tw][info]" class="textarea" placeholder="請輸入摘要"></textarea>
      </p>
    </div>
    <div class="field">
      <label class="label">封面圖</label>
      <gee-upload module-name="{{ENTITY}}" data-param="cover"></gee-upload>
    </div>
    <div class="field">
      <label class="label">關聯標籤</label>
      <div class="control">
        <input type="text" multiple class="multipleSelect" name="tag_ids" data-url="tag/get_opts" placeholder="搜尋標籤">
      </div>
    </div>

    <div class="tabs-footer">
      <div class="field is-grouped">
        <p class="control">
          <button type="submit" class="button is-primary">儲存</button>
        </p>
        <p class="control">
          <button type="button" class="button" data-gene="click:hideModal">取消</button>
        </p>
      </div>
    </div>
  </form>
</div>
