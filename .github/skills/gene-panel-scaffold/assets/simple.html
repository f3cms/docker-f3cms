<nav class="level">
  <div class="level-left"><h1 class="module-title title is-2">{{ENTITY_TITLE}}</h1></div>
  <div class="level-right">
    <p class="level-item"><a class="button is-primary gee" data-gene="click:loadRow" data-tmpl="{{ENTITY}}Form" data-id="0">新增</a></p>
  </div>
</nav>
<div class="columns is-multiline">
  <div class="column is-8">
    <div class="content box-shadow table-wrapper has-mobile-cards">
      <table class="list-body table is-striped is-hoverable">
        <thead><tr><th>#</th><th>標題</th><th>狀態</th><th>上線時間</th><th class="is-actions-cell">操作</th></tr></thead>
        <tfoot></tfoot>
        <tbody class="gee" data-gene="init:loadList,click:reactList" data-tmpl="{{ENTITY}}List" data-nopde="1"></tbody>
      </table>
    </div>
  </div>
  <div class="column is-4">
    <div class="box">
      <form class="gee" data-gene="init:loadRow,submit:setRow" data-tmpl="{{ENTITY}}Form" id="{{ENTITY}}Form">
        <input type="hidden" name="id">
        <div class="field">
          <label class="label">標題</label>
          <p class="control"><input class="input" name="lang[tw][title]" type="text"></p>
        </div>
        <div class="field">
          <label class="label">摘要</label>
          <p class="control"><textarea name="lang[tw][info]" class="textarea"></textarea></p>
        </div>
        <div class="field">
          <label class="label">封面圖</label>
          <gee-upload module-name="{{ENTITY}}" data-param="cover"></gee-upload>
        </div>
        <div class="field">
          <label class="label">關聯標籤</label>
          <div class="control">
            <input type="text" multiple class="multipleSelect" name="tag_ids" data-url="tag/get_opts">
          </div>
        </div>
        <div class="field is-grouped">
          <p class="control"><button type="submit" class="button is-primary">送出</button></p>
          <p class="control"><button type="button" class="button pre-gee" data-gene="click:cancelForm">取消</button></p>
        </div>
      </form>
    </div>
  </div>
</div>
