<form class="gee engrossed-form" data-gene="init:loadRow,submit:setRow" data-tmpl="{{ENTITY}}Form" id="{{ENTITY}}Form">
  <input type="hidden" name="id">

  <div class="box">
    <h3 class="title is-5">多語內容 (Multilingual Slot)</h3>
    <div class="field">
      <label class="label">標題</label>
      <p class="control">
        <input class="input" name="lang[tw][title]" type="text" placeholder="請輸入標題">
      </p>
    </div>
    <div class="field">
      <label class="label">摘要</label>
      <p class="control">
        <textarea name="lang[tw][info]" class="textarea" placeholder="請輸入摘要"></textarea>
      </p>
    </div>
    <div class="field">
      <label class="label">詳細內容</label>
      <p class="control">
        <gee:editor data-param="lang[tw][content]" data-inline="0"></gee:editor>
      </p>
    </div>
  </div>

  <div class="box">
    <h3 class="title is-5">屬性欄位 (Settings Slot)</h3>
    <div class="field">
      <label class="label">分類</label>
      <p class="control">
        <span class="select">
          <gee:set-option module="category" name="cate_id"></gee:set-option>
        </span>
      </p>
    </div>
    <div class="field">
      <label class="label">狀態</label>
      <input type="radio" class="is-checkradio" name="status" value="Published" id="{{ENTITY}}-status-published" checked>
      <label class="radio" for="{{ENTITY}}-status-published">發布</label>
      <input type="radio" class="is-checkradio" name="status" value="Draft" id="{{ENTITY}}-status-draft">
      <label class="radio" for="{{ENTITY}}-status-draft">草稿</label>
    </div>
    <div class="field">
      <label class="label">上線時間</label>
      <p class="control">
        <input type="datetime-local" class="datetime-local input" name="online_date">
      </p>
    </div>
  </div>

  <div class="box">
    <h3 class="title is-5">媒體欄位 (Media Slot)</h3>
    <div class="field">
      <label class="label">封面圖</label>
      <gee-upload module-name="{{ENTITY}}" data-param="cover"></gee-upload>
    </div>
    <div class="field">
      <label class="label">橫幅圖</label>
      <gee-uploadDnD module-name="{{ENTITY}}" multiple="false" data-param="banner"></gee-uploadDnD>
    </div>
  </div>

  <div class="box">
    <h3 class="title is-5">關聯欄位 (Relation Slot)</h3>
    <div class="field">
      <label class="label">作者</label>
      <div class="control">
        <input type="text" multiple class="multipleSelect" name="author_ids" data-url="author/get_opts" placeholder="搜尋作者">
      </div>
    </div>
    <div class="field">
      <label class="label">標籤</label>
      <div class="control">
        <input type="text" multiple class="multipleSelect" name="tag_ids" data-url="tag/get_opts" placeholder="搜尋標籤">
      </div>
    </div>
  </div>

  <div class="field is-grouped">
    <p class="control">
      <button type="submit" class="button is-primary">儲存</button>
    </p>
    <p class="control">
      <button type="button" class="button" data-gene="click:cancelForm">取消</button>
    </p>
  </div>
</form>
